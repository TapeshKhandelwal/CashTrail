# CashTrail full stack for a local demo: PostgreSQL, the Django API and the Next.js app.
#
#   docker compose up --build
#
# Then open http://localhost:3000 (Swagger: http://localhost:8000/api/docs/,
# health: http://localhost:8000/api/health/).
# The first start migrates the database and loads the demo dataset; later starts keep the
# data in the "pgdata" volume. `docker compose down -v` deletes it.
#
# Host ports can be changed with FRONTEND_PORT, BACKEND_PORT and DB_PORT, e.g.
#   FRONTEND_PORT=3200 BACKEND_PORT=8200 DB_PORT=5433 docker compose up --build
#
# The defaults below are for a local demo over plain http://localhost only.

name: cashtrail

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashtrail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashtrail"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-docker-demo-only-0f6c1e7b9a4d2c8e5b3a1f7d9c2e4b6a8d0f1c3e}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-local-docker-demo-only-bff-7c2a9e4f1b6d}
      DEBUG: "False"
      # "backend" is the hostname the frontend container uses.
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://postgres:postgres@db:5432/cashtrail
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:${BACKEND_PORT:-8000}
      # Served over plain HTTP on localhost: no HTTPS redirect, no HSTS.
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
      CASHFREE_NOTIFY_URL: ${CASHFREE_NOTIFY_URL:-}
      CASHFREE_RETURN_URL: ${CASHFREE_RETURN_URL:-}
      # Load the demo dataset on first start (skipped when it is already present).
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Compiled into the bundle, so changing them needs `docker compose up --build`.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
        NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
        NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side only: the BFF route handlers reach Django over the compose network.
      API_URL: http://backend:8000/api
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-local-docker-demo-only-bff-7c2a9e4f1b6d}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
