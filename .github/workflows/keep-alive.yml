# The hosted API runs on a free plan that sleeps after 15 idle minutes and takes about a
# minute to wake. A request every 10 minutes keeps it awake. It calls the API docs page,
# which needs no database, so the database can still pause when nobody is using the app.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
                https://cashtrail-api.onrender.com/api/docs/; then
              exit 0
            fi
            sleep 20
          done
          exit 1
